spring.application.name=Sehaty

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Sehaty}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
storage.provider = CLOUDINARY
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
sehaty.files.max-per-user=10
sehaty.files.allowed-extensions=pdf,jpg,jpeg,png,doc,docx

# ===============================
# SERVER & APP CONFIGURATION
# ===============================
server.port= 8089
app.frontend-url=${FRONTEND_URL:http://localhost:8089}
sehaty.share.expiry-minutes=15

# ===============================
# THYMELEAF CONFIGURATION
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ===============================
# SECURITY & RATE LIMITING
# ===============================
jwt.secret=${JWT_SECRET}
rate.limit.requests=5
rate.limit.window-ms=60000
# IMPORTANT: Use a secure, 16-character key and manage it outside of version control
sehaty.encryption.key=${ENCRYPTION_KEY}

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.com.Sehaty.Sehaty=DEBUG

